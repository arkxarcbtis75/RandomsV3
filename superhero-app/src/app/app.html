<!-- app.html -->
<div class="container py-4">
  <div class="text-center mb-4">
    <h1 class="fw-bold text-primary display-5">Buscador de Superhéroes</h1>
    <p class="text-muted">Selecciona un criterio de búsqueda de los 3 disponibles</p>
  </div>

  <div class="row justify-content-center mb-5 g-2">
    <div class="col-12 col-md-3">
      <select class="form-select form-select-lg shadow-sm" [(ngModel)]="criterioBusqueda">
        <option value="nombre">1. Nombre</option>
        <option value="nombreReal">2. Nombre Real</option>
        <option value="alias">3. Alias</option>
        <option value="bando">4. Bando (good/bad)</option>
        <option value="editorial">5. Editorial</option>
        <option value="genero">6. Género (Male/Female)</option>
      </select>
    </div>

    <div class="col-12 col-md-5">
      <input
        type="text"
        class="form-control form-control-lg shadow-sm"
        [(ngModel)]="valorBusqueda"
        (keyup.enter)="realizarBusqueda()"
        placeholder="Escribe tu término de búsqueda..."
      />
    </div>

    <div class="col-12 col-md-2">
      <button
        type="button"
        class="btn btn-primary btn-lg w-100 shadow-sm"
        (click)="realizarBusqueda()"
      >
        Buscar
      </button>
    </div>
  </div>

  <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-4 justify-content-center">
    @for (heroe of listaDeHeroes; track heroe.id) {
      <div class="col">
        <div
          class="card h-100 shadow border-0 overflow-hidden cursor-pointer"
          (click)="verDetalles(heroe)"
        >
          <img
            [src]="heroe.images.md || heroe.images.sm"
            [alt]="heroe.name"
            class="card-img-top"
            style="height: 280px; object-fit: cover"
          />
          <div class="card-body text-center d-flex flex-column justify-content-between">
            <h5 class="card-title fw-bold text-dark mb-3">{{ heroe.name }}</h5>

            <button class="btn btn-outline-primary btn-sm w-100">
              Ver detalles
            </button>
          </div>
        </div>
      </div>
    }
  </div>
</div>

<div class="container py-4 text-center">

  <!-- Título -->
  <h1 class="mb-4">
    ¡Buscador de Superhéroes 🦸‍♂️
  </h1>

  <!-- Buscador -->
  <div class="row justify-content-center mb-4">
    <div class="col-12 col-md-8 col-lg-6">

      <div class="input-group">
        <input
          [(ngModel)]="nombreBusqueda"
          (keyup.enter)="realizarBusqueda()"
          type="text"
          class="form-control"
          placeholder="Escribe un héroe (en inglés)..."
        />

        <button
          type="button"
          class="btn btn-primary"
          (click)="realizarBusqueda()"
        >
          Buscar
        </button>
      </div>

    </div>
  </div>

  <!-- Lista de superhéroes -->
  <div class="row g-4 justify-content-center">

    @for (heroe of listaDeHeroes; track heroe.id) {

      <div class="col-12 col-sm-6 col-md-4 col-lg-3">

        <!-- Tarjeta -->
        <div class="card h-100 shadow">

          <!-- Imagen -->
          <div class="ratio ratio-4x3">
            <img
  [src]="heroe.image?.url"
  [alt]="heroe.name"
  class="card-img-top img-fluid"
  alt="Imagen del superhéroe"
/>
          </div>

          <!-- Información -->
          <div class="card-body text-center">

            <h3 class="card-title fs-5">
              {{ heroe.name }}
            </h3>

            <p class="card-text fw-bold">
              Bando:
              {{ heroe.biography?.alignment === 'good'
                ? '😇 Bueno'
                : '😈 Malo'
              }}
            </p>

          </div>

        </div>

      </div>
    }

  </div>

</div>

<div class="container py-4">
  <div class="text-center mb-4">
    <h1 class="fw-bold text-primary display-5">Buscador de Personaje de comics </h1>
    <p class="text-muted">Encuentra a cualquier personaje de comic de Superheroes</p>
  </div>

  <div class="row justify-content-center mb-5">
    <div class="col-12 col-md-6 d-flex gap-2">
      <input
        type="text"
        class="form-control form-control-lg shadow-sm"
        [(ngModel)]="nombreBusqueda"
        (keyup.enter)="realizarBusqueda()"
        placeholder="Escribe un héroe (ej. superman, batman)..."
      />
      <button
        type="button"
        class="btn btn-primary btn-lg shadow-sm px-4"
        (click)="realizarBusqueda()"
      >
        Buscar
      </button>
    </div>
  </div>

  <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-4 justify-content-center">
    @for (heroe of listaDeHeroes; track heroe.id) {
      <div class="col">
        <div class="card h-100 shadow border-0 overflow-hidden">
          <img
            [src]="heroe.image?.url"
            [alt]="heroe.name"
            class="card-img-top"
            style="height: 280px; object-fit: cover"
          />
          <div class="card-body text-center d-flex flex-column justify-content-between">
            <h5 class="card-title fw-bold text-dark">{{ heroe.name }}</h5>

            <div>
              <span
                class="badge"
                [ngClass]="heroe.biography?.alignment === 'good' ? 'bg-success' : 'bg-danger'"
              >
                {{ heroe.biography?.alignment === 'good' ? 'Bueno' : 'Malo' }}
              </span>
            </div>
          </div>
        </div>
      </div>
    }
  </div>
</div>
